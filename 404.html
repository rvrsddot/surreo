<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="content-type" content="text/html; charset=utf-8" />
  <title>404 — Surreo Studio</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex,follow" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,500;12..96,700;12..96,800&display=swap" />
  <style>
    :root{--paper:#f2ede0;--muted:#8d8677}
    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{
      min-height:100vh;
      background:#111;color:var(--paper);
      font-family:"Bricolage Grotesque",system-ui,sans-serif;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      padding:32px 20px;text-align:center;gap:clamp(28px,4vw,44px);
    }
    .logo{width:clamp(80px,10vw,120px);height:auto;display:block;opacity:.95}
    .code{
      font-weight:800;font-size:clamp(96px,18vw,220px);line-height:.9;letter-spacing:-.06em;margin:0;
    }
    .msg{
      font-weight:500;font-size:clamp(16px,2vw,22px);line-height:1.3;color:var(--paper);margin:0;max-width:32ch;text-wrap:balance;
    }
    .sub{
      font:600 11px/1 ui-monospace,monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0;
    }
    .back{
      display:inline-flex;align-items:center;gap:10px;
      color:var(--paper);text-decoration:none;
      border:1.5px solid var(--paper);border-radius:999px;
      padding:14px 22px;font-weight:700;font-size:14px;letter-spacing:-.01em;
      transition:background .15s ease,color .15s ease,transform .12s ease;
    }
    .back:hover{background:var(--paper);color:#111;transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--paper)}
    .back:focus-visible{outline:3px solid var(--paper);outline-offset:3px}
    .foot{
      position:fixed;bottom:16px;left:0;right:0;
      font:600 10px/1 ui-monospace,monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
    }
  </style>
</head>
<body>
  <img class="logo" src="/favicon.svg" alt="Surreo Studio" />
  <div>
    <p class="sub">Errore</p>
    <h1 class="code">404</h1>
  </div>
  <p class="msg">Questa pagina non esiste — o non esiste più.</p>
  <a class="back" href="/">
    <span>Torna alla home</span>
    <svg viewBox="0 0 72 14" width="34" height="10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M2 7h64M56 2l10 5-10 5"/></svg>
  </a>
  <p class="foot">Surreo Studio · surreostudio.com</p>
</body>
</html>
