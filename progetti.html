<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/lang.js"></script>
<title data-en="Projects — Surreo Studio">Progetti — Surreo Studio</title>
  <meta name="description" data-en-content="Index of Surreo Studio’s work: graphic and branding, industrial design, exhibit and videomapping, music videos and motion, websites, virtual experiences and VR." content="Indice dei lavori di Surreo Studio: graphic e branding, industrial design, exhibit e videomapping, videoclip e motion, website, esperienze virtuali e VR." />
  <link rel="canonical" href="https://surreostudio.com/progetti.html" />
  <meta name="robots" content="index, follow, max-image-preview:large" />
  <meta name="theme-color" content="#0a0a0a" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Surreo Studio" />
  <meta property="og:title" content="Progetti — Surreo Studio" />
  <meta property="og:description" content="Indice dei lavori: branding, industrial, exhibit, motion, web, VR." />
  <meta property="og:url" content="https://surreostudio.com/progetti.html" />
  <meta property="og:image" content="https://surreostudio.com/og-image.jpg" />
  <meta property="og:locale" content="it_IT" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wdth,wght@8..144,25..151,100..1000&family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/bn/bn.css">
<style>
/* barra filtri */
.fl{position:sticky;top:0;z-index:30;background:var(--w);border-top:1px solid var(--k);border-bottom:1px solid var(--k);padding:10px var(--pad) 10px;display:flex;justify-content:space-between;gap:16px;align-items:center;margin-top:10px}
.fl__c{display:flex;gap:6px;flex-wrap:wrap}
.fl__v{display:flex;gap:6px;flex:none}
.fl__n{flex:none}
/* indice */
.ix{padding:0 var(--pad)}
.ix__r{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--gut);align-items:baseline;padding:12px 0;border-bottom:1px solid var(--k);position:relative;cursor:pointer}
.ix__r::before{content:"";position:absolute;inset:0 calc(var(--pad) * -1);background:var(--k);opacity:0;transition:opacity .15s}
.ix__r>*{position:relative}
.ix__r:hover::before{opacity:1}.ix__r:hover{color:var(--w);--bg:var(--k);--fg:var(--w)}
.ix__k{grid-column:1/2}
.ix__t{grid-column:2/7;font:800 clamp(20px,2.3vw,36px)/1 var(--sans);font-variation-settings:"wdth" 70,"opsz" 48;text-transform:uppercase;transition:font-variation-settings .45s var(--ease)}
.ix__r:hover .ix__t{font-variation-settings:"wdth" 130,"opsz" 48}
.ix__c{grid-column:7/9}
.ix__d{grid-column:9/12;color:var(--g)}
.ix__r:hover .ix__d{color:#bbb}
.ix__a{grid-column:12/13;text-align:right}
.ix__m{display:none}
.out{display:none!important}
/* griglia */
.gr{display:none;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--gut);padding:16px var(--pad) 0}
.is-grid .ix{display:none}.is-grid .gr{display:grid}
.gc{cursor:pointer}
.gc .gi{aspect-ratio:4/5;background:#ddd}
.gc .gi .base{transition:transform .8s var(--ease)}
.gc:hover .gi .base{transform:scale(1.04)}
.gc__l{display:flex;justify-content:space-between;gap:8px;padding-top:8px}
.gc__l b{font:800 15px/1 var(--sans);font-variation-settings:"wdth" 80;text-transform:uppercase}
/* anteprima */
.pv{position:fixed;left:0;top:0;width:clamp(220px,22vw,340px);aspect-ratio:4/5;z-index:40;pointer-events:none;opacity:0;transition:opacity .2s;background:var(--k)}
.pv.on{opacity:1}
.pv__cap{position:absolute;left:0;right:0;bottom:0;padding:8px 10px;color:var(--w);background:linear-gradient(transparent,rgba(0,0,0,.7));display:flex;justify-content:space-between;z-index:2}

/* ================= SCHEDA PROGETTO ================= */
.sd{position:fixed;inset:0;z-index:55;background:var(--w);color:var(--k);--bg:var(--w);--fg:var(--k);overflow-y:auto;clip-path:inset(100% 0 0 0);transition:clip-path .7s var(--ease);overscroll-behavior:contain}
.sd.open{clip-path:inset(0)}
.sd__bar{position:sticky;top:0;z-index:3;background:var(--w);display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--gut);align-items:center;padding:12px var(--pad);border-bottom:1px solid var(--k)}
.sd__back{grid-column:1/4;cursor:pointer;background:none;border:0;text-align:left}
.sd__pos{grid-column:4/7}
.sd__cat{grid-column:7/10}
.sd__nav{grid-column:10/13;display:flex;justify-content:flex-end;gap:6px}
.sd__nav button{appearance:none;background:none;border:1px solid var(--k);padding:6px 10px;cursor:pointer}
.sd__nav button:hover{background:var(--k);color:var(--w)}
.sd__body{padding-top:clamp(20px,3vw,40px);padding-bottom:40px;align-items:start}
.sd__info{grid-column:1/6;position:sticky;top:70px;display:flex;flex-direction:column;gap:22px}
.sd__name{font-size:clamp(46px,6.4vw,112px);overflow-wrap:anywhere}
.sd__type{color:var(--g)}
.sd__desc{font:300 clamp(16px,1.25vw,19px)/1.4 var(--sans);max-width:46ch}
.sd__tags{list-style:none;border-top:1px solid var(--k)}
.sd__tags li{display:grid;grid-template-columns:36px 1fr;padding:7px 0;border-bottom:1px solid var(--k);font:500 14px/1.2 var(--sans)}
.sd__tags li span{font:400 11px var(--mono);color:var(--g)}
.sd__vid{align-self:flex-start}
.sd__view{grid-column:6/13}
.sd__main{position:relative;background:#e6e6e2;aspect-ratio:4/3;cursor:e-resize}
.sd__main .gi{position:absolute;inset:0}
.sd__main .gi img{object-fit:contain}
.sd__main iframe{position:absolute;inset:0;width:100%;height:100%;border:0;z-index:3;background:#000}
.sd__cnt{display:flex;justify-content:space-between;padding:8px 0}
.sd__th{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}
.sd__th button{appearance:none;border:0;padding:0;background:#ddd;aspect-ratio:1;position:relative;cursor:pointer;overflow:hidden;outline:1px solid transparent;outline-offset:2px}
.sd__th button img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(1);transition:filter .3s}
.sd__th button:hover img,.sd__th button[aria-current] img{filter:none}
.sd__th button[aria-current]{outline-color:var(--k)}
.sd__th button span{position:absolute;left:4px;top:3px;font:500 9px var(--mono);color:#fff;mix-blend-mode:difference}
.sd__next{display:block;background:var(--k);color:var(--w);--bg:var(--k);--fg:var(--w);padding:18px var(--pad) var(--pad);cursor:pointer;border:0;width:100%;text-align:left}
.sd__next .mono{display:flex;justify-content:space-between}
.sd__next b{display:block;margin-top:14px;font-size:clamp(46px,9vw,160px);transition:font-variation-settings .6s var(--ease)}
.sd__next:hover b{font-variation-settings:"wdth" 100,"opsz" 144}

@media (max-width:700px){
  .fl{flex-wrap:wrap;gap:8px}
  .fl__c{flex-wrap:nowrap;overflow-x:auto;width:100%;scrollbar-width:none;margin:0 calc(var(--pad) * -1);padding:0 var(--pad)}
  .fl__c::-webkit-scrollbar{display:none}
  .fl__c .chip{flex:none}
  .ix__r{grid-template-columns:34px 1fr 64px;column-gap:10px;padding:8px 0;align-items:center}
  .ix__k{grid-column:1}.ix__t{grid-column:2;font-size:21px;line-height:.95}
  .ix__c{grid-column:2;grid-row:2;color:var(--g);font-size:10px;margin-top:4px}
  .ix__d,.ix__a{display:none}
  .ix__m{display:block;grid-column:3;grid-row:1/3;width:64px;aspect-ratio:1;background:#ddd}
  .ix__r:hover::before{opacity:0}.ix__r:hover{color:inherit}
  .ix__r.on::before{opacity:1}.ix__r.on{color:var(--w)}
  .ix__r.on .ix__t{font-variation-settings:"wdth" 120,"opsz" 48}
  .ix__r.on .ix__c{color:#bbb}
  .gr{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pv{display:none}
  .sd__back{grid-column:1/7}.sd__pos{grid-column:7/13;text-align:right}.sd__cat{display:none}
  .sd__nav{grid-column:1/13;justify-content:space-between;margin-top:8px}
  .sd__info{grid-column:1/13;position:static}
  .sd__view{grid-column:1/13;margin-top:24px;order:-1}
  .sd__main{aspect-ratio:1}
  .sd__th{grid-template-columns:repeat(5,minmax(0,1fr))}
}
</style>
</head>
<body data-page="progetti">

<main class="light">
  <section class="ph">
    <div class="g ph__meta mono"><span>Surreo · Index</span><span>Showcase · Video · Motion · Website</span><span>Ed. 2026</span><span id="cnt">—</span></div>
    <h1 class="ph__t disp gl" data-t="Projects" data-fit="320">Projects</h1>
    <div class="g ph__sub"><p class="dec" data-en="Every project, from identity to space, from website to film.">Ogni progetto, dall’identità allo spazio, dal sito al film.</p><span class="r mono" data-en="Click a project to open its sheet">Clicca un progetto per aprire la scheda</span></div>
  </section>

  <div class="fl" id="fl">
    <div class="fl__c" id="cats"></div>
    <div class="fl__v"><button class="chip" data-v="ix" aria-pressed="true" data-en="Index">Indice</button><button class="chip" data-v="gr" aria-pressed="false" data-en="Grid">Griglia</button></div>
  </div>

  <section id="list">
    <div class="ix" id="ix"></div>
    <div class="gr" id="gr"></div>
  </section>
</main>

<div class="pv" id="pv"><div class="gi bw" style="position:absolute;inset:0"><img class="base" alt=""><img class="sl" alt=""><img class="sl" alt=""></div><div class="pv__cap mono"><span id="pvK"></span><span id="pvC"></span></div></div>

<!-- scheda -->
<div class="sd" id="sd" aria-hidden="true" role="dialog" aria-label="Scheda progetto" data-en-aria-label="Project sheet">
  <div class="sd__bar mono">
    <button class="sd__back mono" id="sdClose">← Index</button>
    <span class="sd__pos" id="sdPos"></span>
    <span class="sd__cat" id="sdCat"></span>
    <div class="sd__nav"><button id="sdPrev" data-en="← Prev">← Prec.</button><button id="sdNext" data-en="Next →">Succ. →</button><button id="sdX" data-en="Close ✕">Chiudi ✕</button></div>
  </div>
  <div class="g sd__body">
    <div class="sd__info">
      <span class="sd__type mono" id="sdType"></span>
      <h2 class="sd__name disp" id="sdName"></h2>
      <p class="sd__desc" id="sdDesc"></p>
      <ul class="sd__tags" id="sdTags"></ul>
      <button class="chip sd__vid" id="sdVid" hidden data-en="▶ Watch the video">▶ Guarda il video</button>
    </div>
    <div class="sd__view">
      <div class="sd__main" id="sdMain"><div class="gi" id="sdGi"><img class="base" alt=""><img class="sl" alt=""><img class="sl" alt=""></div></div>
      <div class="sd__cnt mono"><span id="sdFr"></span><span data-en="Click the image or use ← → to browse">Clic sull’immagine o ← → per scorrere</span></div>
      <div class="sd__th" id="sdTh"></div>
    </div>
  </div>
  <button class="sd__next" id="sdNextBig"><span class="mono"><span data-en="Next project">Prossimo progetto</span><span id="sdNextK"></span></span><b class="disp" id="sdNextN"></b></button>
</div>

<footer data-bn="cta"></footer>

<script src="/bn/bn.js"></script>
<script>
(async () => {
  const kick = window.bnKick;
  const [data, vids] = await Promise.all([
    fetch('/projects.json').then(r => r.json()),
    fetch('/videos.json').then(r => r.json()).catch(() => ({}))
  ]);
  const beside = (vids && vids.beside) || {};
  const EN = document.documentElement.lang === 'en';
  const L = [];
  data.sections.forEach(s => s.projects.forEach(p => {
    if (!p.frames || !p.frames.length) return;
    L.push({ id: p.id, name: p.name || p.id, type: p.type || '', cat: s.id, catT: (EN && s.title_en) || s.title,
      desc: (EN && p.description_en) || p.description || '', tags: p.tags || [],
      frames: p.frames.map(f => '/' + f), thumbs: p.frames.map(f => '/' + f.replace(/\/([^/]+)$/, '/m/$1')),
      vid: beside[p.id] && beside[p.id][0] });
  }));
  const pad = n => String(n).padStart(3, '0');
  document.getElementById('cnt').textContent = pad(L.length) + (EN ? ' projects' : ' progetti');

  /* indice + griglia */
  const ix = document.getElementById('ix'), gr = document.getElementById('gr');
  const gi = (src, cls = 'bw') => `<div class="gi ${cls}"><img class="base" loading="lazy" src="${src}" alt=""><img class="sl" loading="lazy" src="${src}" alt=""><img class="sl" loading="lazy" src="${src}" alt=""></div>`;
  ix.innerHTML = L.map((p, i) => `<a class="ix__r" href="?p=${p.id}" data-i="${i}" data-c="${p.cat}">
    <span class="ix__k mono">${pad(i + 1)}</span><b class="ix__t">${p.name}</b><span class="ix__c mono">${p.catT}</span>
    <span class="ix__d mono">${p.tags.slice(0, 3).join(' · ')}</span><span class="ix__a mono">↗</span>
    <span class="ix__m">${gi(p.thumbs[0])}</span></a>`).join('');
  gr.innerHTML = L.map((p, i) => `<a class="gc" href="?p=${p.id}" data-i="${i}" data-c="${p.cat}" data-gk>${gi(p.thumbs[0])}
    <div class="gc__l"><b>${p.name}</b><span class="mono">${pad(i + 1)}</span></div></a>`).join('');
  ix.querySelectorAll('.ix__r').forEach(window.bnScan);
  gr.querySelectorAll('.gc').forEach(c => c.addEventListener('mouseenter', () => kick(c.querySelector('.gi'))));

  /* filtri */
  const cats = document.getElementById('cats'); const cnt = {};
  L.forEach(p => cnt[p.cat] = (cnt[p.cat] || 0) + 1);
  cats.innerHTML = `<button class="chip" data-c="all" aria-pressed="true">${EN ? 'All' : 'Tutti'}<b>${L.length}</b></button>` +
    data.sections.filter(s => cnt[s.id]).map(s => `<button class="chip" data-c="${s.id}" aria-pressed="false">${(EN && s.title_en) || s.title}<b>${cnt[s.id]}</b></button>`).join('');
  let filter = 'all';
  const visible = () => L.map((p, i) => i).filter(i => filter === 'all' || L[i].cat === filter);
  const applyFilter = c => {
    filter = c;
    cats.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', x.dataset.c === c));
    document.querySelectorAll('#ix .ix__r, #gr .gc').forEach(r => r.classList.toggle('out', c !== 'all' && r.dataset.c !== c));
  };
  cats.addEventListener('click', e => { const b = e.target.closest('.chip'); if (b) applyFilter(b.dataset.c); });
  const qs = new URLSearchParams(location.search);
  if (qs.get('cat') && cnt[qs.get('cat')]) applyFilter(qs.get('cat'));
  document.querySelectorAll('[data-v]').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('[data-v]').forEach(x => x.setAttribute('aria-pressed', x === b));
    document.getElementById('list').classList.toggle('is-grid', b.dataset.v === 'gr');
  }));

  /* anteprima che segue il cursore */
  const pv = document.getElementById('pv'), pvG = pv.querySelector('.gi'), pvI = [...pvG.querySelectorAll('img')];
  let tx = 0, ty = 0, x = 0, y = 0, hov = -1;
  ix.addEventListener('mousemove', e => { tx = e.clientX + 24; ty = e.clientY - 120; });
  ix.addEventListener('mouseover', e => {
    const r = e.target.closest('.ix__r'); if (!r || matchMedia('(max-width:700px)').matches) return;
    const i = +r.dataset.i; if (i === hov) return; hov = i;
    pvI.forEach(im => im.src = L[i].thumbs[0]);
    document.getElementById('pvK').textContent = pad(i + 1); document.getElementById('pvC').textContent = L[i].catT;
    pv.classList.add('on'); kick(pvG);
  });
  ix.addEventListener('mouseleave', () => { pv.classList.remove('on'); hov = -1; });
  let run = false;
  const f = () => { x += (tx - x) * .18; y += (ty - y) * .18;
    pv.style.transform = `translate(${Math.min(x, innerWidth - pv.offsetWidth - 16)}px,${Math.max(60, Math.min(y, innerHeight - pv.offsetHeight - 16))}px)`;
    if (pv.classList.contains('on')) requestAnimationFrame(f); else run = false; };
  ix.addEventListener('mouseover', () => { if (!run && pv.classList.contains('on')) { run = true; requestAnimationFrame(f); } });

  /* ---------- scheda ---------- */
  const sd = document.getElementById('sd'), $ = id => document.getElementById(id);
  const sdGi = $('sdGi'), sdI = [...sdGi.querySelectorAll('img')], th = $('sdTh'), main = $('sdMain');
  let cur = -1, fr = 0;
  const showFrame = n => {
    const p = L[cur]; fr = (n + p.frames.length) % p.frames.length;
    main.querySelector('iframe')?.remove();
    sdI.forEach(im => im.src = p.frames[fr]); kick(sdGi);
    $('sdFr').textContent = String(fr + 1).padStart(2, '0') + ' / ' + String(p.frames.length).padStart(2, '0');
    th.querySelectorAll('button').forEach((b, j) => b.toggleAttribute('aria-current', j === fr));
  };
  const open = (i, push = true) => {
    cur = i; const p = L[i]; const v = visible(); const pos = v.indexOf(i);
    $('sdPos').textContent = pad(i + 1) + ' / ' + pad(L.length);
    $('sdCat').textContent = p.catT; $('sdType').textContent = p.type;
    const nm = $('sdName'); nm.textContent = p.name;
    $('sdDesc').textContent = p.desc;
    $('sdTags').innerHTML = p.tags.map((t, j) => `<li><span>${String(j + 1).padStart(2, '0')}</span>${t}</li>`).join('');
    th.innerHTML = p.thumbs.map((t, j) => `<button aria-label="${EN ? 'Image' : 'Immagine'} ${j + 1}"><img loading="lazy" src="${t}" alt=""><span>${String(j + 1).padStart(2, '0')}</span></button>`).join('');
    th.querySelectorAll('button').forEach((b, j) => b.onclick = () => showFrame(j));
    $('sdVid').hidden = !p.vid;
    const nx = L[v[(pos + 1) % v.length]];
    $('sdNextN').textContent = nx.name; $('sdNextK').textContent = nx.catT;
    showFrame(0);
    sd.scrollTop = 0; sd.classList.add('open'); sd.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
    if (!matchMedia('(prefers-reduced-motion: reduce)').matches) window.bnDecode(nm);
    if (push) history.replaceState(null, '', '?p=' + p.id);
  };
  const close = () => { sd.classList.remove('open'); sd.setAttribute('aria-hidden', 'true'); document.body.style.overflow = ''; history.replaceState(null, '', location.pathname); cur = -1; };
  const step = d => { const v = visible(); const pos = v.indexOf(cur); open(v[(pos + d + v.length) % v.length]); };
  document.addEventListener('click', e => {
    const a = e.target.closest('.ix__r, .gc'); if (!a) return;
    e.preventDefault(); open(+a.dataset.i);
  });
  main.addEventListener('click', e => { if (e.target.tagName === 'IFRAME') return; const r = main.getBoundingClientRect(); showFrame(fr + (e.clientX - r.left < r.width / 3 ? -1 : 1)); });
  $('sdClose').onclick = $('sdX').onclick = close;
  $('sdPrev').onclick = () => step(-1); $('sdNext').onclick = $('sdNextBig').onclick = () => step(1);
  $('sdVid').onclick = () => { main.querySelector('iframe')?.remove();
    main.insertAdjacentHTML('beforeend', `<iframe src="https://www.youtube-nocookie.com/embed/${L[cur].vid}?autoplay=1&rel=0" allow="autoplay; fullscreen" allowfullscreen title="Video"></iframe>`); };
  addEventListener('keydown', e => {
    if (cur < 0) return;
    if (e.key === 'Escape') close();
    if (e.key === 'ArrowRight') showFrame(fr + 1);
    if (e.key === 'ArrowLeft') showFrame(fr - 1);
  });
  const deep = qs.get('p'); if (deep) { const i = L.findIndex(p => p.id === deep); if (i >= 0) open(i, false); }
})();
</script>
</body>
</html>
